
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css"/>
        <title>Lumora Studios</title>
    </head>
    <body>
        <nav>
            <div class="nav__header">
                <div class="nav__logo">
                    <a href="#">
                        <img src="assets/white-logo.png" alt="logo" class="logo-white">
                        <img src="assets/purple-logo.png" alt="logo" class="logo-pink">
                    </a>
                </div>
                <div class="nav__menu__btn" id="menu-btn" aria-label="Open navigation menu">
                    <i class="ri-menu-4-line"></i>
                </div>
            </div>
            <ul class="nav__links" id="nav-links">
                <li><a href="#"class="active">HOME</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">PORTFOLIO</a></li>
                <li><a href="#">CONTACT US</a></li>
            </ul>
        </nav>

        <header>
            <div class="header__image">
                <img src="assets/photography.jpg" alt="header" />
            </div>
            <div class="header__content">
                <h2>CAPTURE THE MOMENT</h2>
                <div class="hero__line"></div>
                <h1>Your Story, Beautifully Framed</h1>
                <p>From intimate portraits to unforgettable celebrations, we capture authentic moments and turn them into timeless visual stories.</p>
                <div class="header__btn">
                <button>BOOK A SESSION</button>
                <button class="secondary__btn">VIEW PORTFOLIO</button>
                </div>

                <div class="header__stats">
                    <div class="stat">
                        <h3>500+</h3>
                        <p>Sessions</p>
                    </div>

                    <div class="stat">
                        <h3>100+</h3>
                        <p>Happy Clients</p>
                    </div>

                    <div class="stat">
                        <h3>5</h3>
                        <p>Years Experience</p>
                    </div>
                </div>
            
                <ul class="header__socials">
                    <li>
                        <a href="#" aria-label="Facebook"><i class="ri-facebook-fill"></i></a>
                    </li>
                    <li>
                        <a href="#" aria-label="Instagram"><i class="ri-instagram-fill"></i></a>
                    </li>
                    <li>
                        <a href="#" aria-label="Behance"><i class="ri-behance-fill"></i></a>
                    </li>
                </ul>

            </div>
            
        </header>

        

        <script src="https://unpkg.com/scrollreveal"></script>
        <script src="main.js"></script>
    </body>
</html>
